[package]
name = "fastanim-py"
description = "The `fastanim` Python package"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fastanim_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
fastanim-core.workspace = true
# Not `workspace = true`: cargo won't let a member turn off default features the workspace
# entry leaves on.
fastanim-script = { path = "../fastanim-script", version = "0.1.0", default-features = false }
fastanim-text.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[dev-dependencies]
# For the Rust and Rhai versions of the example scenes, which the Python ones must match.
fastanim-bevy.workspace = true
fastanim-script.workspace = true
# Writes WAVs for the sound tests.
hound = "3.5"

[lints]
workspace = true
