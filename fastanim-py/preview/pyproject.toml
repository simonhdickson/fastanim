# `pip install fastanim[preview]`: the native module of `fastanim` built with the `preview`
# feature, so with `fastanim-bevy` (SPEC §15.2). `fastanim` imports from it when it is installed.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fastanim-preview"
description = "Video, PNG and the preview window for fastanim"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]

[tool.maturin]
manifest-path = "../Cargo.toml"
features = ["preview"]
python-source = "python"
module-name = "fastanim_preview._native"
