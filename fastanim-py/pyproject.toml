[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fastanim"
description = "Animated math and code scenes, recorded once and played anywhere"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "fastanim._native"
