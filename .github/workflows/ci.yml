name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # full debuginfo on bevy test binaries makes parallel links exhaust runner RAM
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=/usr/bin/mold

    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y clang mold libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev mesa-vulkan-drivers ffmpeg python3-dev

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # The Pyodide wheel's build of the Python module, without rendering.
      - name: Clippy (fastanim-py without preview)
        run: cargo clippy -p fastanim-py --all-targets --no-default-features

      - name: Test (fastanim-py without preview)
        run: cargo test -p fastanim-py --no-default-features

      - name: Build & run tests
        run: cargo test --workspace

  # The Python package built for Pyodide, which the playground runs Python scenes with.
  pyodide:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: astral-sh/setup-uv@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The cross-build environment and Emscripten, a few hundred MB.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pyodide-build
          key: pyodide-build-${{ hashFiles('justfile') }}

      - name: Build wheel
        run: just pyodide-wheel

      - uses: actions/upload-artifact@v4
        with:
          name: pyodide-wheel
          path: fastanim-web/wheels/*.whl
          if-no-files-found: error

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, pyodide]

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,mdbook

      - uses: actions/download-artifact@v4
        with:
          name: pyodide-wheel
          path: fastanim-web/wheels

      - name: Trunk
        run: trunk build --release --public-url ./
        working-directory: fastanim-web

      # The scripting docs, served beside the playground at /docs/.
      - name: mdBook
        run: mdbook build docs/book -d fastanim-web/dist/docs

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: fastanim-web/dist

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
