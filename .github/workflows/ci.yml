name: CI

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # full debuginfo on bevy test binaries makes parallel links exhaust runner RAM
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=/usr/bin/mold

    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y clang mold libudev-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers ffmpeg

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build & run tests
        run: cargo test --workspace

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Trunk
        run: trunk build --release --public-url ./
        working-directory: fastanim-web

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: fastanim-web/dist

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
