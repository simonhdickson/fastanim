name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  upload-assets:
    needs: create-release

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Deps
        if: runner.os == 'Linux'
        # clang and mold: .cargo/config.toml links with them on Linux.
        run: sudo apt-get update && sudo apt-get install -y clang mold libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      # archive is fastanim-<target>.tar.gz with the binary at its root, matching
      # [package.metadata.binstall] in fastanim-cli/Cargo.toml
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: fastanim
          package: fastanim-cli
          target: ${{ matrix.target }}
          archive: fastanim-$target
          tar: all
          zip: none
          token: ${{ github.token }}

  # The `fastanim` Python package (fastanim-py), versioned from the workspace's Cargo version,
  # so tag the release to match it. Each wheel is abi3 for CPython 3.10+, plus a 3.14t wheel for
  # free-threaded Python, which abi3 doesn't cover.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # On Linux the build runs in a manylinux container, which has both interpreters.
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: |
            3.10
            3.14t

      - uses: PyO3/maturin-action@v1
        env:
          # The manylinux container has neither the clang nor the mold that .cargo/config.toml
          # links with on Linux; RUSTFLAGS replaces its rustflags.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=bfd' || '' }}
        with:
          args: --release --out dist -m fastanim-py/Cargo.toml -i python3.10 python3.14t
          # Set up inside the manylinux container too, on the GitHub Actions cache.
          sccache: "true"
          manylinux: "2_28"
          # Bevy links audio, input and windowing libraries.
          before-script-linux: dnf install -y systemd-devel libxkbcommon-devel wayland-devel alsa-lib-devel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ strategy.job-index }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m fastanim-py/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Trusted publishing: the PyPI project needs this repository, `release.yml` and the `pypi`
  # environment added as a trusted publisher; no token is stored.
  pypi:
    needs: [wheels, sdist]

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/fastanim/

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
