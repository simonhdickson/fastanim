[workspace]
resolver = "3"
members = ["fastanim*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simonhdickson/fastanim"

[workspace.dependencies]
fastanim-diff = { path = "fastanim-diff", version = "0.1.0" }
fastanim-core = { path = "fastanim-core", version = "0.1.0" }
fastanim-text = { path = "fastanim-text", version = "0.1.0" }
fastanim-bevy = { path = "fastanim-bevy", version = "0.1.0" }
fastanim-script = { path = "fastanim-script", version = "0.1.0" }
fastanim-web = { path = "fastanim-web", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
