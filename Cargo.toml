[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simonhdickson/ranim"

[workspace.dependencies]
ranim-diff = { path = "crates/ranim-diff", version = "0.1.0" }
ranim-core = { path = "crates/ranim-core", version = "0.1.0" }
ranim-text = { path = "crates/ranim-text", version = "0.1.0" }
ranim-bevy = { path = "crates/ranim-bevy", version = "0.1.0" }
ranim-script = { path = "crates/ranim-script", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
