[workspace]
resolver = "3"
members = ["fastanim*"]
# The browser playground is static files, built by Trunk.
exclude = ["fastanim-web"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/simonhdickson/fastanim"

[workspace.dependencies]
fastanim-diff = { path = "fastanim-diff", version = "0.1.2" }
fastanim-core = { path = "fastanim-core", version = "0.1.2" }
fastanim-text = { path = "fastanim-text", version = "0.1.2" }
fastanim-bevy = { path = "fastanim-bevy", version = "0.1.2" }
fastanim-script = { path = "fastanim-script", version = "0.1.2" }

[workspace.lints.rust]
missing_docs = "warn"
