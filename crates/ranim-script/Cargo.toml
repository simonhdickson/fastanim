[package]
name = "ranim-script"
description = "Rhai scenes for ranim"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true

[dependencies]
ranim-core.workspace = true
ranim-text.workspace = true
# No `ahash/runtime-rng`: it needs getrandom, which wasm32-unknown-unknown lacks (SPEC §14.1).
rhai = { version = "1.26", default-features = false, features = ["std", "sync"] }

[dev-dependencies]
# For the Rust versions of the example scenes, which the scripts must match.
ranim-bevy.workspace = true

[lints]
workspace = true
