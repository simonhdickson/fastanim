[package]
name = "fastanim-bevy"
description = "Bevy plugin for fastanim: timeline sync, vector rendering, preview and export"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true

[dependencies]
fastanim-core.workspace = true
bevy = { version = "0.19", default-features = false, features = ["default_app", "2d_bevy_render", "std", "multi_threaded", "bevy_winit", "x11", "wayland", "default_font"] }
bevy_vello = "0.14"
vello_cpu = { version = "0.0.8", default-features = false, features = ["std", "u8_pipeline", "multithreading"] }
clap = { version = "4.6.7", features = ["derive"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"], optional = true }

[features]
default = ["audio"]
# Sound in the preview. On Linux it needs ALSA's headers (`libasound2-dev`).
audio = ["dep:rodio"]

[dev-dependencies]
fastanim-text.workspace = true

# The plain-Rust baseline of `bench/epicycles`, kept beside the other versions of the scene.
[[example]]
name = "epicycles"
path = "../bench/epicycles/epicycles.rs"

[lints]
workspace = true
