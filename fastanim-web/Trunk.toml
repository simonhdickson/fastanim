# `trunk serve` (or `just web`) copies the playground into dist/ and serves it with live
# reload; `trunk build --release` is the CI build. Python scenes run on the Pyodide wheel in
# wheels/, from `just pyodide-wheel`, which a change to the Rust crates needs rebuilding.

[build]
target = "index.html"
# worker.js and player.js import each other by name.
filehash = false

[watch]
watch = [".", "../fastanim-py/scenes"]
ignore = ["dist"]
