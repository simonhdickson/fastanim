[package]
name = "fastanim-web"
description = "Browser player and playground for fastanim scenes"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fastanim-core.workspace = true
fastanim-script.workspace = true
fastanim-text.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "Path2d"] }

[lints]
workspace = true
